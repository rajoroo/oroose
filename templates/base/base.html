{% load menu %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.0/css/all.min.css">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet" crossorigin="anonymous">
    <link href="{% static 'css/common.css' %}" rel="stylesheet" crossorigin="anonymous">
    <link href="{% static 'css/style.css' %}" rel="stylesheet" crossorigin="anonymous">
    <meta name="theme-color" content="#7952b3">
    <style>
        .fa,
        .far,
        .fas {
            font-family: "Font Awesome 5 Free";
        }
        a:hover {color: #fff !important; font-size: 18px;}
        .active {background: rgba(236, 238, 239, 0.3); font-size: 18px;}
    </style>
    {% block title %}
    {% endblock title %}

</head>

<body translate="no">
  <div class="dashboard">
    <div class="dashboard-nav">
        <header>
            <a href="#!" class="menu-toggle"><i class="fas fa-bars"></i></a>
            <a href="#" class="brand-logo"><i class="fas fa-anchor"></i>
                <span>OROOSE</span>
            </a>
        </header>
        <nav class="dashboard-nav-list">
            {% show_menu_navbar page=active_page path=active_path %}
          <div class="nav-item-divider"></div>
          <a href="{% url 'logout' %" class="dashboard-nav-item"><i class="fas fa-sign-out-alt"></i> Signout </a>
        </nav>
    </div>
    <div class="dashboard-app">
        <header class="dashboard-toolbar"><a href="#!" class="menu-toggle"><i class="fas fa-bars"></i></a></header>
        <div class="dashboard-content">
            <div class="container">
                {% block content %}
                {% endblock content %}
            </div>
        </div>
    </div>
</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script id="rendered-js" src="{% static 'js/theme_2_render.js' %}" crossorigin="anonymous"></script>
    {% block js_scripts %}
    {% endblock js_scripts %}
</body>
</html>
